[package]
name = "orbise-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter"
] }
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "model",
    "rustls_backend"
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
